[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "fedlex-mcp"
version     = "1.2.0"
description = "MCP Server for Swiss federal law via the Fedlex SPARQL endpoint"
readme      = "README.md"
license     = { file = "LICENSE" }
requires-python = ">=3.11"

keywords = [
    "mcp", "model-context-protocol", "swiss-open-data",
    "fedlex", "swiss-law", "sparql", "claude", "llm",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Upper bound added deliberately: `mcp` 2.0.0 removed `mcp.server.fastmcp`
    # outright (the API moved to `mcp.server.mcpserver`), so an unbounded
    # `>=1.28.1` breaks every fresh install — CI and `pip install` alike.
    # Migrating to the 2.x API is real work and a decision to take on purpose,
    # not one a resolver should make silently.
    "mcp[cli]>=1.28.1,<2",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0.0",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "respx>=0.21.0",
    "ruff>=0.15.15",
]
# Optional OpenTelemetry tracing (OBS-006). Enabled at runtime only when
# OTEL_EXPORTER_OTLP_ENDPOINT is set; otherwise a complete no-op.
otel = [
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
]

[project.scripts]
fedlex-mcp = "fedlex_mcp.server:mcp.run"

[project.urls]
Homepage   = "https://github.com/malkreide/fedlex-mcp"
Repository = "https://github.com/malkreide/fedlex-mcp"
Issues     = "https://github.com/malkreide/fedlex-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fedlex_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-v --tb=short"
markers      = [
    "live: live API tests (skipped in CI by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
